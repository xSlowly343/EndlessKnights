<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Панель Предметы</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Rubik:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 480px; height: 786px; display: flex; flex-direction: column; gap: 6px; background: #0F2236; font-family: Rubik, 'Segoe UI', sans-serif; color: #EEF2FF">
  <section aria-label="Панель" style="width: 480px; height: 600px; box-sizing: border-box; display: flex; flex-direction: column; border-radius: 12px; border: 1px solid #3A4870; background: #1B2236; overflow: hidden">
    <div style="height: 46px; flex: none; position: relative; display: flex; align-items: center; gap: 10px; padding: 0 8px; box-sizing: border-box; border-bottom: 1px solid #3A4870">
      <div style="position: absolute; left: 222px; top: 4px; width: 36px; height: 4px; border-radius: 2px; background: #4A5677"></div>
      <div style="height: 30px; padding: 0 14px; display: flex; align-items: center; border-radius: 6px; background: #B02A2A; box-shadow: inset 0 -2px 0 #F0B43C; font-weight: 700; font-size: 15px">Предметы</div>
      <div style="display: flex; align-items: center; gap: 4px; font-family: 'Lilita One', Rubik, sans-serif; font-size: 14px; color: #F0B43C"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#F0B43C"></circle><circle cx="12" cy="12" r="5" fill="none" stroke="#9A6A12" stroke-width="2"></circle></svg>12.4K</div>
      <div style="display: flex; align-items: center; gap: 4px; font-family: 'Lilita One', Rubik, sans-serif; font-size: 14px; color: #C59BFF"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l7 7-7 13-7-13z" fill="#C59BFF"></path></svg>18</div>
      <div style="flex: 1"></div>
      <button type="button" aria-label="Закрепить" style="width: 30px; height: 30px; border-radius: 6px; border: 0; background: #26304A; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#AEB9D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 6 3 3H7l3-3z M12 13v7"></path></svg></button>
      <button type="button" aria-label="Свернуть в полоску" style="width: 30px; height: 30px; border-radius: 6px; border: 0; background: #7A1E1E; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFE4E4" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg></button>
    </div>
    <div style="height: 40px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 10px">
      <button type="button" style="height: 28px; padding: 0 14px; border-radius: 14px; border: 0; background: #2E3A58; color: #EEF2FF; font-family: inherit; font-size: 13px; font-weight: 500">Сумка</button>
      <button type="button" style="height: 28px; padding: 0 14px; border-radius: 14px; border: 0; background: transparent; color: #AEB9D6; font-family: inherit; font-size: 13px">Артефакты</button>
      <button type="button" style="height: 28px; padding: 0 14px; border-radius: 14px; border: 0; background: transparent; color: #AEB9D6; font-family: inherit; font-size: 13px">Разбор</button>
      <div style="flex: 1"></div>
      <div style="font-size: 12px; color: #AEB9D6">28 / 60</div>
    </div>
    <div style="flex: 1; min-height: 0; padding: 0 16px 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; position: relative">
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <button type="button" style="height: 26px; padding: 0 12px; border-radius: 13px; border: 1px solid #F0B43C; background: #3A2E14; color: #FFE2A0; font-family: inherit; font-size: 12px">Все</button>
        <button type="button" style="height: 26px; padding: 0 12px; border-radius: 13px; border: 1px solid #3A4870; background: transparent; color: #D5DCEE; font-family: inherit; font-size: 12px">Оружие</button>
        <button type="button" style="height: 26px; padding: 0 12px; border-radius: 13px; border: 1px solid #3A4870; background: transparent; color: #D5DCEE; font-family: inherit; font-size: 12px">Броня</button>
        <button type="button" style="height: 26px; padding: 0 12px; border-radius: 13px; border: 1px solid #3A4870; background: transparent; color: #D5DCEE; font-family: inherit; font-size: 12px">Украшения</button>
        <button type="button" style="height: 26px; padding: 0 12px; border-radius: 13px; border: 1px solid #3A4870; background: transparent; color: #D5DCEE; font-family: inherit; font-size: 12px">Новые 3</button>
        <button type="button" style="height: 26px; padding: 0 12px; border-radius: 13px; border: 1px solid #3A4870; background: transparent; color: #D5DCEE; font-family: inherit; font-size: 12px">Лучше надетого</button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="21">
          <button type="button" aria-label="{{c.name}}" style="{{c.style}}">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{c.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"></path></svg>
            <sc-if value="{{c.isNew}}" hint-placeholder-val="{{false}}">
              <span style="position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 50%; background: #FF4D4D"></span>
            </sc-if>
          </button>
        </sc-for>
      </div>
      <div style="border-radius: 12px; background: #26304A; border: 1px solid #FF9A3C; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 -8px 20px rgba(0,0,0,0.35)">
        <div style="display: flex; align-items: center; gap: 10px">
          <div style="width: 44px; height: 44px; border-radius: 8px; border: 2px solid #FF9A3C; background: #1B2236; display: flex; align-items: center; justify-content: center; flex: none">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FF9A3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6L9 21l-6-6z M7 13l4 4"></path></svg>
          </div>
          <div style="flex: 1; min-width: 0">
            <div style="font-weight: 700; font-size: 15px; color: #FFB870">Клинок Зари</div>
            <div style="font-size: 12px; color: #AEB9D6">Оружие · легендарный · ур. 40</div>
          </div>
          <div style="font-size: 11px; color: #AEB9D6; text-align: right">надето:<br>Меч стража</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; font-size: 13px">
          <div style="display: flex; justify-content: space-between"><span>+18% урона удара</span><span style="color: #6FE39A">было +11%</span></div>
          <div style="display: flex; justify-content: space-between"><span>+6% шанса крита</span><span style="color: #FF8A80">было +9%</span></div>
          <div style="display: flex; justify-content: space-between"><span>+120 к Энергии</span><span style="color: #6FE39A">новое</span></div>
        </div>
        <div style="display: flex; gap: 8px">
          <button type="button" style="flex: 1; height: 34px; border-radius: 8px; border: 0; background: #F0B43C; color: #2A1C00; font-family: inherit; font-weight: 700; font-size: 13px; box-shadow: inset 0 -3px 0 #B47E1A">Надеть</button>
          <button type="button" style="flex: 1; height: 34px; border-radius: 8px; border: 0; background: #3F6FD1; color: #FFFFFF; font-family: inherit; font-weight: 500; font-size: 13px; box-shadow: inset 0 -3px 0 #2A4E9A">В избранное</button>
          <button type="button" style="flex: 1; height: 34px; border-radius: 8px; border: 1px solid #B02A2A; background: transparent; color: #FFB4B4; font-family: inherit; font-weight: 500; font-size: 13px">Разобрать</button>
        </div>
      </div>
    </div>
    <dc-import name="TabBar" active="items" hint-size="480px,60px"></dc-import>
  </section>
  <dc-import name="Strip" variant="solo" show-zones="false" hint-size="480px,180px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":786}}'>
class Component extends DCLogic {
  renderVals() {
    const rarity = ['#9AA3B5', '#4FC277', '#5B9BFF', '#B07CFF', '#FF9A3C'];
    const icons = [
      { name: 'Оружие', d: 'M14 4h6v6L9 21l-6-6z M7 13l4 4' },
      { name: 'Шлем', d: 'M5 14a7 7 0 0 1 14 0v5H5z M12 7V4' },
      { name: 'Кольцо', d: 'M12 8a6 6 0 1 0 0 12a6 6 0 1 0 0-12 M10 4h4l-2 4z' },
      { name: 'Доспех', d: 'M6 4l6 2 6-2 2 6-3 2v8H7v-8l-3-2z' },
      { name: 'Сапоги', d: 'M8 4h5v9l6 3v4H6v-6z' }
    ];
    const rar = [2, 0, 1, 3, 0, 1, 4, 1, 0, 2, 1, 0, 3, 1, 2, 0, 1, 0, 2, 1, 0];
    const cells = rar.map((r, i) => {
      const ic = icons[(i * 3) % icons.length];
      const sel = i === 6;
      return {
        name: ic.name,
        d: ic.d,
        color: rarity[r],
        isNew: i === 6 || i === 3 || i === 12,
        style: 'position: relative; height: 54px; border-radius: 8px; padding: 0; display: flex; align-items: center; justify-content: center; background: #22304A; border: 2px solid ' + rarity[r] + (sel ? '; box-shadow: 0 0 0 2px #FFFFFF' : '')
      };
    });
    return { cells };
  }
}
</script>
</body>
</html>
