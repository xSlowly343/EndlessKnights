<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Полоска боя, итог</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Rubik:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 480px; height: 412px; display: flex; flex-direction: column; background: #0F1626; font-family: Rubik, 'Segoe UI', sans-serif; color: #EEF2FF">
  <sc-for list="{{states}}" as="st" hint-placeholder-count="2">
    <div style="height: 18px; padding: 2px 4px 0; font-size: 11px; color: #8C97B6; {{st.gapStyle}}">{{st.caption}}</div>
    <div style="width: 480px; height: 180px; position: relative; overflow: hidden; box-sizing: border-box; border-radius: 10px; border: 1px solid rgba(238,242,255,0.14); background: #19213A">
      <div style="position: absolute; left: 0; right: 0; top: 150px; height: 2px; background: #2E5A3A"></div>

      <div style="position: absolute; left: 0; right: 0; top: 6px; height: 26px; display: flex; align-items: center; justify-content: center; gap: 10px">
        <div style="font-family: 'Lilita One', Rubik, sans-serif; font-size: 16px">Этап 26</div>
        <sc-if value="{{st.wave}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; align-items: center; gap: 3px">
            <sc-for list="{{waveSegs}}" as="w" hint-placeholder-count="4">
              <div style="width: 22px; height: 6px; border-radius: 3px; background: #3A4870; overflow: hidden"><div style="{{w.fill}}"></div></div>
            </sc-for>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8C97B6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-left: 2px"><path d="M12 3a7 7 0 0 0-7 7v3l2 2v3h10v-3l2-2v-3a7 7 0 0 0-7-7z M9.5 11h.01 M14.5 11h.01"></path></svg>
          </div>
        </sc-if>
        <sc-if value="{{st.boss}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; align-items: center; gap: 6px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FF8A8A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a7 7 0 0 0-7 7v3l2 2v3h10v-3l2-2v-3a7 7 0 0 0-7-7z M9.5 11h.01 M14.5 11h.01"></path></svg>
            <div style="width: 70px; height: 4px; border-radius: 2px; background: #3A1A22; overflow: hidden"><div style="width: 58%; height: 4px; background: #E0574A"></div></div>
            <div style="font-family: 'Lilita One', Rubik, sans-serif; font-size: 14px; color: #FFD7D7">18 с</div>
          </div>
        </sc-if>
      </div>
      <button type="button" aria-label="Открыть панель" style="position: absolute; right: 8px; top: 5px; width: 28px; height: 28px; border-radius: 7px; border: 1px solid #F0B43C; background: #2E3A58; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F0B43C" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16 M4 12h16 M4 17h16"></path></svg>
      </button>

      <div style="position: absolute; left: 10px; top: 6px; height: 26px; display: flex; align-items: center; gap: 4px; font-family: 'Lilita One', Rubik, sans-serif; font-size: 15px; color: #F0B43C">
        <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#F0B43C"></circle><circle cx="12" cy="12" r="5" fill="none" stroke="#9A6A12" stroke-width="2"></circle></svg>
        19.9K
      </div>
      <div style="position: absolute; left: 60px; top: 84px; width: 50px; height: 66px; border-radius: 22px 22px 8px 8px; background: #3F6FD1"></div>

      <div style="position: absolute; left: 8px; top: 153px; height: 26px; display: flex; align-items: center; gap: 6px">
        <div style="position: relative; width: 26px; height: 26px; border-radius: 50%; box-sizing: border-box; border: 2px solid #2B4C8C; background: linear-gradient(to top, #3F7BFF 0%, #6FA0FF 62%, #121828 62%); display: flex; align-items: center; justify-content: center">
          <span style="font-family: 'Lilita One', Rubik, sans-serif; font-size: 11px; color: #FFFFFF; text-shadow: 0 1px 2px #000">62</span>
        </div>
        <div style="width: 1px; height: 18px; background: #3A4870"></div>
        <div style="display: flex; gap: 4px">
          <sc-for list="{{skills}}" as="s" hint-placeholder-count="3">
            <button type="button" aria-label="{{s.name}}" style="{{s.box}}">
              <sc-if value="{{s.cooling}}" hint-placeholder-val="{{false}}">
                <div style="{{s.fill}}"></div>
              </sc-if>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#EEF2FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{s.iconStyle}}"><path d="{{s.d}}"></path></svg>
              <sc-if value="{{s.cooling}}" hint-placeholder-val="{{false}}">
                <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Lilita One', Rubik, sans-serif; font-size: 12px; color: #FFFFFF; text-shadow: 0 1px 2px #000">{{s.secs}}</div>
              </sc-if>
            </button>
          </sc-for>
        </div>
      </div>

      <sc-if value="{{st.wave}}" hint-placeholder-val="{{true}}">
        <div style="position: absolute; left: 150px; top: 112px; width: 200px; height: 3px; border-radius: 2px; background: #8FD3FF; opacity: 0.6"></div>
        <div style="position: absolute; right: 16px; top: 108px; width: 30px; height: 42px; border-radius: 14px 14px 6px 6px; background: #6A2E26; opacity: 0.35"></div>
        <div style="position: absolute; right: 36px; top: 104px; width: 32px; height: 46px; border-radius: 14px 14px 6px 6px; background: #6A2E26; opacity: 0.5"></div>
        <div style="position: absolute; right: 64px; top: 90px; width: 56px; height: 60px; border-radius: 24px 24px 8px 8px; background: #B5453A"></div>
        <div style="position: absolute; left: 318px; top: 64px; font-family: 'Lilita One', Rubik, sans-serif; font-size: 17px; color: #FFFFFF; text-shadow: 0 1px 0 #0A0E1A, 0 0 3px #0A0E1A">1 240</div>
        <div style="position: absolute; left: 356px; top: 42px; font-family: 'Lilita One', Rubik, sans-serif; font-size: 27px; color: #FF9A2E; text-shadow: 0 2px 0 #6A2400, 0 0 12px rgba(255,120,30,0.7)">3 900</div>
        <div style="position: absolute; right: 10px; top: 156px; width: 170px; height: 20px; display: flex; align-items: center; gap: 6px">
          <div style="flex: 1; height: 8px; border-radius: 4px; background: #121828; overflow: hidden"><div style="width: 45%; height: 8px; border-radius: 4px; background: #4FC277"></div></div>
          <div style="font-size: 11px; color: #D5DCEE">45%</div>
        </div>
      </sc-if>
      <sc-if value="{{st.boss}}" hint-placeholder-val="{{false}}">
        <div style="position: absolute; left: 150px; top: 112px; width: 214px; height: 3px; border-radius: 2px; background: #8FD3FF; opacity: 0.6"></div>
        <div style="position: absolute; right: 18px; top: 58px; width: 96px; height: 92px; border-radius: 36px 36px 10px 10px; background: #8C3B2E"></div>
        <div style="position: absolute; left: 300px; top: 72px; font-family: 'Lilita One', Rubik, sans-serif; font-size: 17px; color: #FFFFFF; text-shadow: 0 1px 0 #0A0E1A, 0 0 3px #0A0E1A">1 240</div>
        <div style="position: absolute; left: 282px; top: 40px; font-family: 'Lilita One', Rubik, sans-serif; font-size: 27px; color: #FF9A2E; text-shadow: 0 2px 0 #6A2400, 0 0 12px rgba(255,120,30,0.7)">3 900</div>
        <div style="position: absolute; right: 10px; top: 156px; width: 230px; height: 20px; display: flex; align-items: center; gap: 6px">
          <div style="font-size: 11px; color: #FFD7D7; white-space: nowrap">Король-кабан</div>
          <div style="flex: 1; height: 8px; border-radius: 4px; background: #121828; overflow: hidden"><div style="width: 71%; height: 8px; border-radius: 4px; background: #E0574A"></div></div>
          <div style="font-size: 11px; color: #D5DCEE">71%</div>
        </div>
      </sc-if>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":412}}'>
class Component extends DCLogic {
  renderVals() {
    const waveSegs = [1, 1, 0.6, 0].map((f) => ({
      fill: 'width: ' + Math.round(f * 100) + '%; height: 6px; border-radius: 3px; background: ' + (f >= 1 ? '#EEF2FF' : '#8FA6E0')
    }));
    const skill = (name, d, color, readyFrac, secs) => {
      const ready = readyFrac >= 1;
      return {
        name, d, secs,
        cooling: !ready,
        iconStyle: 'position: relative; ' + (ready ? '' : 'opacity: 0.3'),
        box: 'position: relative; width: 24px; height: 24px; border-radius: 6px; padding: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; box-sizing: border-box; ' +
          'background: #141A2B; border: 1.5px solid ' + (ready ? color : '#3A4870') + '; box-shadow: ' + (ready ? '0 0 7px ' + color : 'none'),
        fill: 'position: absolute; left: 0; right: 0; bottom: 0; height: ' + Math.round(readyFrac * 100) + '%; background: ' + color + '; opacity: 0.45'
      };
    };
    return {
      waveSegs,
      states: [
        { caption: 'Волна 3 из 4: сегменты из A, цифры урона у самого врага', wave: true, boss: false, gapStyle: '' },
        { caption: 'Босс: верх и полоска HP как в B, цифры слева над боссом', wave: false, boss: true, gapStyle: 'margin-top: 16px' }
      ],
      skills: [
        skill('Стенография', 'M13 3L5 14h6l-1 7 8-11h-6z', '#E0574A', 1, ''),
        skill('Ураган', 'M4 12a8 8 0 1 0 8-8 M12 8a4 4 0 1 0 4 4', '#4FC277', 0.4, '7'),
        skill('Метка', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18 M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8', '#5B9BFF', 0.8, '2')
      ]
    };
  }
}
</script>
</body>
</html>
