<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Портал в половинной высоте</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Rubik:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 480px; height: 506px; display: flex; flex-direction: column; gap: 6px; background: #0F2236; font-family: Rubik, 'Segoe UI', sans-serif; color: #EEF2FF">
  <section aria-label="Панель" style="width: 480px; height: 320px; box-sizing: border-box; display: flex; flex-direction: column; border-radius: 12px; border: 1px solid #3A4870; background: #1B2236; overflow: hidden">
    <div style="height: 46px; flex: none; position: relative; display: flex; align-items: center; gap: 10px; padding: 0 8px; box-sizing: border-box; border-bottom: 1px solid #3A4870">
      <div style="position: absolute; left: 222px; top: 4px; width: 36px; height: 4px; border-radius: 2px; background: #F0B43C"></div>
      <div style="height: 30px; padding: 0 14px; display: flex; align-items: center; border-radius: 6px; background: #B02A2A; box-shadow: inset 0 -2px 0 #F0B43C; font-weight: 700; font-size: 15px">Портал</div>
      <div style="display: flex; align-items: center; gap: 4px; font-family: 'Lilita One', Rubik, sans-serif; font-size: 14px; color: #8FD3FF"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z" fill="#8FD3FF"></path></svg>340</div>
      <div style="flex: 1"></div>
      <button type="button" aria-label="Развернуть на полную высоту" style="width: 30px; height: 30px; border-radius: 6px; border: 0; background: #26304A; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#AEB9D6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 14l6-6 6 6"></path></svg></button>
      <button type="button" aria-label="Свернуть в полоску" style="width: 30px; height: 30px; border-radius: 6px; border: 0; background: #7A1E1E; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFE4E4" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg></button>
    </div>
    <div style="flex: 1; min-height: 0; padding: 10px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: baseline; gap: 8px">
        <div style="font-family: 'Lilita One', Rubik, sans-serif; font-size: 18px">Этап 37</div>
        <div style="font-size: 12px; color: #AEB9D6">рекорд 52 · до стража 13 этапов</div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{biomes}}" as="b" hint-placeholder-count="4">
          <div style="{{b.style}}">
            <div style="{{b.swatch}}"></div>
            <div style="font-size: 12px; font-weight: 700; line-height: 1.2">{{b.name}}</div>
            <div style="font-size: 11px; color: #AEB9D6">{{b.range}}</div>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; gap: 8px">
        <button type="button" style="flex: 1; height: 34px; border-radius: 8px; border: 0; background: #3F6FD1; color: #FFFFFF; font-family: inherit; font-weight: 500; font-size: 13px; box-shadow: inset 0 -3px 0 #2A4E9A">Повторить босса</button>
        <button type="button" style="flex: 1; height: 34px; border-radius: 8px; border: 0; background: #F0B43C; color: #2A1C00; font-family: inherit; font-weight: 700; font-size: 13px; box-shadow: inset 0 -3px 0 #B47E1A">Престиж: +340 Эхо</button>
      </div>
    </div>
    <dc-import name="TabBar" active="more" hint-size="480px,60px"></dc-import>
  </section>
  <dc-import name="Strip" variant="solo" show-zones="false" hint-size="480px,180px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":506}}'>
class Component extends DCLogic {
  renderVals() {
    const card = (on, locked) => 'height: 112px; border-radius: 10px; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; background: #26304A; border: 2px solid ' + (on ? '#F0B43C' : 'transparent') + '; opacity: ' + (locked ? 0.55 : 1);
    const sw = (c) => 'height: 36px; border-radius: 6px; background: ' + c;
    return {
      biomes: [
        { name: 'Зелёные холмы', range: '1–50 · вы здесь', style: card(true, false), swatch: sw('#4FA35E') },
        { name: 'Песчаные руины', range: '51–100', style: card(false, true), swatch: sw('#C99A4E') },
        { name: 'Ледяной пик', range: '101–150', style: card(false, true), swatch: sw('#8EC5E8') },
        { name: 'Вулканическая кузня', range: '151–200', style: card(false, true), swatch: sw('#C2523A') }
      ]
    };
  }
}
</script>
</body>
</html>
