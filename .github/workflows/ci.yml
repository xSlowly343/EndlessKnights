name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

jobs:
  core-tests:
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Run Game.Core tests
        run: dotnet test Tools/CoreBuild/Game.Core.Tests/Game.Core.Tests.csproj --nologo

  unity:
    runs-on: [self-hosted, unity]
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          lfs: true
      - name: Fetch LFS files
        run: git lfs pull
      - name: Unity tests and Windows build
        run: ./build.ps1 -Tests
      - name: Show Unity errors
        if: failure()
        continue-on-error: true
        run: |
          foreach ($log in Get-ChildItem Builds/Logs -Filter *.log) {
            Write-Host "== $($log.Name)"
            Select-String -Path $log.FullName -Pattern 'error CS|Exception|Failed|Error:' | Select-Object -First 60 | ForEach-Object { $_.Line }
          }
          $results = 'Builds/Logs/editmode-results.xml'
          if (Test-Path $results) {
            ([xml](Get-Content $results)).SelectNodes("//test-case[@result='Failed']") | Select-Object -First 30 | ForEach-Object { Write-Host "FAILED $($_.fullname)"; Write-Host $_.failure.message.InnerText }
          }
      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs
          path: Builds/Logs
